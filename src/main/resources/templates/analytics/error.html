<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error Power BI | Uni-Eats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">
    
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 text-center">
            <div>
                <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-6"></i>
                <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
                    Error de Power BI
                </h2>
                <p class="mt-2 text-sm text-gray-600" th:text="${error}">
                    Ha ocurrido un error al conectar con Power BI.
                </p>
            </div>
            
            <div class="mt-8 space-y-4">
                <a href="/analytics/config" 
                   class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-amber-600 hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
                    <i class="fas fa-cog mr-2"></i>
                    Configurar Power BI
                </a>
                
                <a href="/analytics" 
                   class="group relative w-full flex justify-center py-2 px-4 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
                    <i class="fas fa-arrow-left mr-2"></i>
                    Volver al Dashboard
                </a>
                
                <a href="/" 
                   class="group relative w-full flex justify-center py-2 px-4 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500">
                    <i class="fas fa-home mr-2"></i>
                    Ir al Inicio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
