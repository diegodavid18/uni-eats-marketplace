# ===============================================================
# CONFIGURACIÓN LOCAL CON POSTGRESQL
# ===============================================================

# --- Configuración del Servidor ---
server.port=8092

# --- Conexión a la Base de Datos PostgreSQL Local ---
spring.datasource.url=jdbc:postgresql://localhost:5432/unieats_marketplace
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=2010

# --- Configuración de Hibernate (JPA) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Configuración de Almacenamiento Local ---
# Directorio local para guardar imágenes
app.upload.directory=./uploads

# --- Configuración del Servicio de Correo ---
# Para desarrollo local, configuramos valores por defecto
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Configuración para archivos multipart ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Configuración de Logging ---
logging.level.com.remington.unieats=INFO
logging.level.org.hibernate.SQL=WARN   

# ===============================================================
# CONFIGURACIÓN DE POWER BI EMBEDDED
# ===============================================================

# --- Credenciales de Azure AD ---
# Obtener desde Azure Portal > App Registrations
powerbi.client-id=${POWERBI_CLIENT_ID:}
powerbi.client-secret=${POWERBI_CLIENT_SECRET:}
powerbi.tenant-id=${POWERBI_TENANT_ID:}

# --- Configuración de Power BI ---
# Obtener desde Power BI Service
powerbi.workspace-id=${POWERBI_WORKSPACE_ID:}
powerbi.report-id=${POWERBI_REPORT_ID:}

# --- URLs de Autorización ---
powerbi.authority-url=https://login.microsoftonline.com/
powerbi.scope=https://analysis.windows.net/powerbi/api/.default

# --- Configuración Opcional para Credenciales de Usuario ---
# Solo usar si necesitas autenticación con usuario específico
powerbi.username=${POWERBI_USERNAME:}
powerbi.password=${POWERBI_PASSWORD:}